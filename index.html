<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK STORE</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <header>
        <h1>Book Store</h1>
        <button id="cartBtn">Cart (0)</button>
    </header>

    <!--Books Section-->
    <section id="booksSection">
        <main id="booksContainer"></main> <!--Dynamic-->
    </section>

    <!--Cart Section-->
    <section id="cartSection" class="hidden">
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <h3 id="totalPrice"></h3>
        <button id="checkoutBtn">Checkout</button>
    </section>

    <!--Checkout Section-->
    <section id="checkoutSection" class="hidden">
        <h2>Checkout Successful 🎉</h2>
        <button id="backBtn">Back to Store</button>
    </section>

    <script src="main.js"></script>
</body>

</html>
